# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Configuración del servidor nginx para StreamURU Frontend
#
# Sirve los archivos estáticos del frontend y hace reverse-proxy de:
#   /api/    →  http://backend:4000/api/
#   /stream/ →  http://streaming-server:5000/stream/
#
# Esto evita problemas de CORS porque el navegador siempre habla con el mismo
# origen (el frontend en el puerto 3000).
# ─────────────────────────────────────────────────────────────────────────────

# Número de procesos worker (auto = uno por núcleo de CPU)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Tipos MIME
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 256;

    # ── Upstreams ──────────────────────────────────────────────────────────────
    upstream backend {
        server backend:4000;
    }

    upstream streaming_server {
        server streaming-server:5000;
    }

    # ── Servidor principal ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Archivos estáticos ──────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Proxy → Backend API ─────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts generosos para subidas de video grandes
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout 10s;

            # Tamaño máximo de cuerpo (para subida de videos)
            client_max_body_size 2048m;
        }

        # ── Proxy → Streaming Server (WebRTC / SDP signaling) ──────────────────
        location /stream/ {
            proxy_pass         http://streaming_server/stream/;
            proxy_http_version 1.1;

            # WebSocket upgrade (por si el servidor de streaming usa WS para signaling)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ── Caché de assets estáticos ───────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Seguridad básica: ocultar versión de nginx ──────────────────────────
        server_tokens off;

        # ── Headers de seguridad ────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "SAMEORIGIN"      always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "strict-origin"   always;
    }
}
